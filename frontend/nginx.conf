server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router (SPA) — si el archivo no existe físicamente,
    # sirve siempre index.html para que React decida qué mostrar.
    # Sin esto, recargar la página en /dashboard o /creditos da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachear assets estáticos compilados (tienen hash en el nombre, es seguro)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}